[package]
name = "ccmm-rs"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "Native Rust research implementation of encrypted matrix multiplication and RNS/NTT CKKS evaluation"
repository = "https://github.com/Confidential-Intelligence-Lab/ccmm-rs"

[dependencies]
num-traits = "0.2"
num-bigint = "0.4"
rand = "0.8"
rand_chacha = "0.3"
num-complex = "0.4"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png"] }
# Pin flate2 while png 0.18.x still directly depends on miniz_oxide 0.8.
# Newer flate2 releases use miniz_oxide 0.9, producing a duplicate graph.
flate2 = "=1.1.0"

[dev-dependencies]
approx = "0.5"
proptest = "1.5"
